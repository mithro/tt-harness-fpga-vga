[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tthfv"
version = "0.1.0"
description = "Build iCE40 FPGA bitstreams of Tiny Tapeout VGA designs and produce reference renders"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pyyaml>=6",
    "vgacap",
    "websockets>=17.4",
]

[tool.uv.sources]
# vgacap: its stream reader (vgacap.stream) and board emulator (ttcap.emu), pinned to main 2a1caa7.
vgacap = { git = "ssh://git@github.com/mithro/vgacap.git", rev = "2a1caa703dc0196feac0f9fd5d7f6dfcc443f892" }

[project.scripts]
tthfv = "tthfv.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["tthfv"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_tools: needs the real oss-cad-suite toolchain (verilator); skipped when absent"]
# Remove each test's tmp_path when the test passes, and keep no earlier sessions' directories (pytest 9.2: "failed"
# deletes a passed test's directory at its teardown; "none" would keep every directory until the session ends).
# One full run with the real toolchain made 883,624 files, enough with the next run to exhaust a tmpfs /tmp's inodes.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 0
