[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tthfv"
version = "0.1.0"
description = "Build iCE40 FPGA bitstreams of Tiny Tapeout VGA designs and produce reference renders"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tthfv = "tthfv.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["tthfv"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
